name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        default: v0.6.3
      unsigned_macos:
        description: Build macOS ad hoc without notarization
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare_release:
    name: Prepare GitHub Release draft
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Create or reset release draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${RELEASE_TAG}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            if [[ "$(gh release view "${tag}" --json isDraft --jq '.isDraft')" != "true" ]]; then
              echo "${tag} is already published; refusing to replace it" >&2
              exit 1
            fi

            while IFS= read -r asset; do
              [[ -z "${asset}" ]] && continue
              gh release delete-asset "${tag}" "${asset}" --yes
            done < <(gh release view "${tag}" --json assets --jq '.assets[].name')
          else
            gh release create "${tag}" \
              --draft \
              --verify-tag \
              --title "Crate ${tag}" \
              --notes "Release build in progress."
          fi

  build:
    name: Build ${{ matrix.platform_name }}
    needs: prepare_release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform_name: macOS
            build_script: dist:mac
          - os: windows-latest
            platform_name: Windows
            build_script: dist:win
          - os: ubuntu-latest
            platform_name: Linux
            build_script: dist:linux
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate macOS signing credentials
        if: runner.os == 'macOS' && github.event_name != 'push' && inputs.unsigned_macos != true
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required macOS release secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${RELEASE_TAG}" != "v${package_version}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match package.json version v${package_version}" >&2
            exit 1
          fi

      - name: Cache native audio libraries
        uses: actions/cache@v4
        with:
          path: native/libs
          key: native-libs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-bass.mjs', 'scripts/verify-bass.mjs', 'scripts/fetch-chromaprint.mjs', 'scripts/verify-chromaprint.mjs', 'scripts/chromaprint-config.mjs') }}

      - name: Fetch native audio libraries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run fetch:native

      - name: Verify and load native audio libraries
        run: npm run verify:native -- --load

      - name: Test
        run: npm test

      - name: Electron integration tests
        run: npm run test:integration

      - name: Typecheck
        run: npm run typecheck

      - name: Build ${{ matrix.platform_name }} packages
        if: runner.os != 'macOS' || (github.event_name != 'push' && inputs.unsigned_macos != true)
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: npm run ${{ matrix.build_script }}

      - name: Build unsigned macOS packages
        if: runner.os == 'macOS' && (github.event_name == 'push' || inputs.unsigned_macos == true)
        run: npm run verify:native -- --platform=darwin --arch=universal && npm run build && npx electron-builder --mac --config electron-builder.unsigned.yml --publish never

      - name: Smoke packaged native resources
        run: npm run verify:native -- --packaged-root=release --load

      - name: Verify macOS signatures and notarization
        if: runner.os == 'macOS' && github.event_name != 'push' && inputs.unsigned_macos != true
        shell: bash
        run: |
          set -euo pipefail

          verify_app() {
            local app="$1"
            local expected_arch="$2"
            local signature_info

            [[ "$(lipo -archs "${app}/Contents/MacOS/Crate")" == "${expected_arch}" ]]
            codesign --verify --deep --strict --verbose=4 "${app}"

            signature_info="$(codesign --display --verbose=4 "${app}" 2>&1)"
            [[ "${signature_info}" == *"Authority=Developer ID Application:"* ]]
            [[ "${signature_info}" == *"runtime"* ]]

            codesign --verify --deep --strict --check-notarization --verbose=4 "${app}"
            xcrun stapler validate -v "${app}"
            spctl --assess --type execute --verbose=4 "${app}"
          }

          verify_app "release/mac/Crate.app" "x86_64"
          verify_app "release/mac-arm64/Crate.app" "arm64"

      - name: Verify ad hoc macOS packages
        if: runner.os == 'macOS' && (github.event_name == 'push' || inputs.unsigned_macos == true)
        shell: bash
        run: |
          set -euo pipefail

          verify_app() {
            local app="$1"
            local expected_arch="$2"
            local signature_info

            [[ "$(lipo -archs "${app}/Contents/MacOS/Crate")" == "${expected_arch}" ]]
            codesign --verify --deep --strict --verbose=4 "${app}"

            signature_info="$(codesign --display --verbose=4 "${app}" 2>&1)"
            [[ "${signature_info}" == *"Signature=adhoc"* ]]
            [[ "${signature_info}" != *"Authority="* ]]
          }

          verify_app "release/mac/Crate.app" "x86_64"
          verify_app "release/mac-arm64/Crate.app" "arm64"

      - name: Upload verified macOS release assets
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          assets=(
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml
          )
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No macOS release assets found" >&2
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" "${assets[@]}"

      - name: Upload verified Windows release assets
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $assets = @(
            Get-ChildItem "release/*.exe" -File -ErrorAction SilentlyContinue
            Get-ChildItem "release/*.exe.blockmap" -File -ErrorAction SilentlyContinue
            Get-ChildItem "release/latest.yml" -File -ErrorAction SilentlyContinue
          ) | Sort-Object FullName | Select-Object -ExpandProperty FullName

          if ($assets.Count -eq 0) {
            throw "No Windows release assets found"
          }

          $arguments = @("release", "upload", $env:RELEASE_TAG) + $assets
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload Windows release assets"
          }

      - name: Upload verified Linux release assets
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          assets=(
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
          )
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No Linux release assets found" >&2
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" "${assets[@]}"

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${RELEASE_TAG}"
          notes_file="docs/releases/${tag}.md"
          if [[ ! -f "${notes_file}" ]]; then
            notes_file="docs/releases/${tag#v}.md"
          fi
          if [[ ! -f "${notes_file}" ]]; then
            notes_file="$(mktemp)"
            printf '# Crate %s\n\nRelease build.\n' "${tag}" > "${notes_file}"
          fi

          mapfile -t asset_names < <(gh release view "${tag}" --json assets --jq '.assets[].name')
          require_asset() {
            local pattern="$1"
            local description="$2"
            if ! printf '%s\n' "${asset_names[@]}" | grep -Eiq "${pattern}"; then
              echo "Missing ${description} release asset" >&2
              exit 1
            fi
          }

          require_asset '\.dmg$' 'macOS DMG'
          require_asset '\.zip$' 'macOS ZIP'
          require_asset '^latest-mac\.yml$' 'macOS update metadata'
          require_asset '\.exe$' 'Windows installer'
          require_asset '^latest\.yml$' 'Windows update metadata'
          require_asset '\.AppImage$' 'Linux AppImage'
          require_asset '\.deb$' 'Linux Debian package'
          require_asset '^latest-linux\.yml$' 'Linux update metadata'

          release_flags=()
          if [[ "${tag}" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          else
            release_flags+=(--latest)
          fi

          gh release edit "${tag}" \
            --draft=false \
            --title "Crate ${tag}" \
            --notes-file "${notes_file}" \
            "${release_flags[@]}"
