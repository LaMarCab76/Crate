name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        default: v0.4.3

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform_name: macOS
            artifact_name: macos
            build_script: dist:mac
            artifact_paths: |
              release/*.dmg
              release/*.dmg.blockmap
              release/*.zip
              release/*.zip.blockmap
              release/latest-mac.yml
          - os: windows-latest
            platform_name: Windows
            artifact_name: windows
            build_script: dist:win
            artifact_paths: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - os: ubuntu-latest
            platform_name: Linux
            artifact_name: linux
            build_script: dist:linux
            artifact_paths: |
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build ${{ matrix.platform_name }} packages
        run: npm run ${{ matrix.build_script }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: crate-${{ env.RELEASE_TAG }}-${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: ignore

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${RELEASE_TAG}"
          notes_file="docs/releases/${tag}.md"
          if [[ ! -f "${notes_file}" ]]; then
            notes_file="docs/releases/${tag#v}.md"
          fi
          if [[ ! -f "${notes_file}" ]]; then
            notes_file="$(mktemp)"
            printf '# Crate %s\n\nRelease build.\n' "${tag}" > "${notes_file}"
          fi

          mapfile -t assets < <(find artifacts -type f -print)

          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No assets found to publish" >&2
            exit 1
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --clobber
            gh release edit "${tag}" --title "Crate ${tag}" --notes-file "${notes_file}" --latest
          else
            gh release create "${tag}" "${assets[@]}" --title "Crate ${tag}" --notes-file "${notes_file}" --verify-tag --latest
          fi
