name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug] "
labels: ["bug"]

body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What went wrong? Be as specific as possible.
      placeholder: "The app crashes when importing folders with 20,000+ songs..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Open Crate
        2. Go to Settings → Library
        3. Click "Add Folder"
        4. Select folder with 20,000+ songs
        5. App crashes during scan
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
      placeholder: "Should scan the folder successfully with a progress indicator"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Is the app crashing or just behaving unexpectedly?
      options:
        - "Bug - Unexpected behavior but app runs"
        - "Crash - App quits unexpectedly"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Crate Version
      description: The release you installed (for example from the installer name or the About window)
      placeholder: "e.g., 0.6.6"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: OS version and hardware
      placeholder: "e.g., macOS 15.1 on MacBook Pro M1, Windows 11 23H2, Ubuntu 24.04"

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other relevant information (library size, file formats, audio device, etc.)
      placeholder: "Library has ~50,000 FLAC files, mostly 24-bit/96kHz"

  - type: textarea
    id: logs
    attributes:
      label: Logs & Crash Reports
      description: |
        Paste any error shown by the app, the terminal output when running
        `npm run dev`, or crash reports from your OS (macOS: Console.app →
        Crash Reports; Windows: Event Viewer; Linux: `~/.config/Crate/`).
      render: shell
