appId: com.lautarocaballero.crate
productName: Crate
copyright: Copyright © 2026 Lautaro Caballero

directories:
  buildResources: electron-build
  output: release

electronUpdaterCompatibility: ">=2.16"

publish:
  provider: github
  owner: LaMarCab76
  repo: LocalLibrary

files:
  - out/**/*
  - package.json

extraResources:
  - from: native/libs
    to: native/libs
    filter: ["**/*"]

asarUnpack:
  - native/libs/**

mac:
  category: public.app-category.music
  hardenedRuntime: true
  gatekeeperAssess: false
  forceCodeSigning: true
  identity: Developer ID Application
  entitlements: electron-build/entitlements.mac.plist
  entitlementsInherit: electron-build/entitlements.mac.plist
  notarize: true
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

win:
  target:
    - target: nsis
      arch:
        - x64

linux:
  category: AudioVideo
  maintainer: Lautaro Caballero <lcaballero@frba.utn.edu.ar>
  target:
    - AppImage
    - deb
