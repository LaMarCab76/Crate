appId: com.lautarocaballero.crate
productName: Crate
copyright: Copyright © 2026 Lautaro Caballero

directories:
  buildResources: electron-build
  output: release

electronUpdaterCompatibility: ">=2.16"

publish:
  provider: github
  owner: LaMarCab76
  repo: Crate

files:
  - out/**/*
  - package.json

extraResources:
  - from: native/libs
    to: native/libs
    filter: ["**/*"]
  - from: .
    to: licenses
    filter: [LICENSE, LICENSE-BASS-EXCEPTION.md, THIRD_PARTY_NOTICES.md]
  - from: licenses
    to: licenses
    filter: ["**/*"]

asarUnpack:
  - native/libs/**

mac:
  category: public.app-category.music
  hardenedRuntime: true
  gatekeeperAssess: false
  forceCodeSigning: true
  identity: Developer ID Application
  entitlements: electron-build/entitlements.mac.plist
  entitlementsInherit: electron-build/entitlements.mac.plist
  notarize: true
  extendInfo:
    NSDesktopFolderUsageDescription: Crate necesita leer y modificar las bibliotecas de música que elijas, incluso para editar metadatos y mover archivos a la Papelera.
    NSDocumentsFolderUsageDescription: Crate necesita leer y modificar las bibliotecas de música que elijas, incluso para editar metadatos y mover archivos a la Papelera.
    NSDownloadsFolderUsageDescription: Crate necesita leer y modificar las bibliotecas de música que elijas, incluso para editar metadatos y mover archivos a la Papelera.
    NSNetworkVolumesUsageDescription: Crate necesita leer y modificar las bibliotecas de música que elijas en volúmenes de red, incluso para sincronizar y mover archivos a la Papelera.
    NSRemovableVolumesUsageDescription: Crate necesita leer y modificar las bibliotecas de música que elijas en discos externos, incluso para sincronizar y mover archivos a la Papelera.
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

win:
  target:
    - target: nsis
      arch:
        - x64

linux:
  category: AudioVideo
  maintainer: Lautaro Caballero <lcaballero@frba.utn.edu.ar>
  target:
    - AppImage
    - deb
